{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Signup - MyBlog</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <!-- Header Section -->
    <header>
        <h2>MyBlog</h2>

        <nav>
            <a href="{% url 'blogs' %}">Home</a>
            <a href="{% url 'blogs' %}#about">About</a>
            <a href="{% url 'blogs' %}#blog">Blog</a>
        </nav>
    </header>

    <!-- Signup Section -->
    <main class="signup-container">

        <div class="signup-box">

            <h1>Create Your Account</h1>

            <p class="signup-description">
                Join MyBlog and start sharing your stories!
            </p>

            <form action="{% url 'signup' %}" method="post">
                {% csrf_token %}

                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <!-- Terms and Conditions -->
                <div class="terms">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        value="yes"
                        required
                    >

                    <label for="terms">
                        I agree to the Terms and Conditions
                    </label>
                </div>

                <!-- Create Account Button -->
                <button type="submit" class="signup-submit">
                    Create Account
                </button>

            </form>

            <!-- Login Link -->
            <p class="login-text">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>

            <!-- Back to Home -->
            <p class="signup-home">
                <a href="{% url 'blogs' %}">Back to Home</a>
            </p>

        </div>

    </main>
<!-- Footer -->
    <footer>
        <p>© 2026 MyBlog. All rights reserved.</p>
    </footer>
</body>
</html>
