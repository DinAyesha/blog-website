{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - MyBlog</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <!-- Header Section -->
    <header>
        <h2>MyBlog</h2>

        <nav>
            <a href="{% url 'blogs' %}">Home</a>
            <a href="{% url 'blogs' %}#about">About</a>
            <a href="{% url 'blogs' %}#blog">Blog</a>
            <a href="{% url 'blogs' %}#blog">Contact</a>
        </nav>
    </header>

    <!-- Login Section -->
    <main class="login-container">

        <div class="login-box">

            <h1>Welcome Back!</h1>

            <p class="login-description">
                Login to continue reading and sharing stories.
            </p>

            <form action="{% url 'login' %}" method="post">
                {% csrf_token %}

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Remember Me and Forgot Password -->
                <div class="login-options">

                    <label for="remember">
                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                            value="yes"
                        >
                        Remember Me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>

            <!-- Sign Up Link -->
            <p class="signup-text">
                Don't have an account?
                <a href="{% url 'signup' %}">Sign Up</a>
            </p>

            <!-- Back to Home -->
            <p class="back-home">
                <a href="{% url 'blogs' %}">Back to Home</a>
            </p>

        </div>

    </main>
<!-- Footer -->
    <footer>
        <p>© 2026 MyBlog. All rights reserved.</p>
    </footer>
</body>
</html>
