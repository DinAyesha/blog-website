
{% extends "base_email.html" %}

{% block email_content %}

<h2>Hello,</h2>

<p>
    We received a request to reset your MyBlog account password.
</p>

<p>
    Click below to create a new password.
</p>

<p style="text-align:center; margin:30px 0;">
    <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
       style="display:inline-block; background:#263238; color:#ffffff;
              padding:14px 30px; text-decoration:none; border-radius:6px;">
        Reset My Password
    </a>
</p>

<p>
    If you did not request this, you can safely ignore this email.
</p>

<p>Thank you,<br><strong>MyBlog Team</strong></p>

{% endblock %}
